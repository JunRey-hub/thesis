name: thesis
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- FIREBASE ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.3.10
  firebase_storage: ^12.4.0
  cloud_firestore: ^5.6.12

  # --- IMAGE HANDLING ---
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # --- MAPS & LOCATION ---
  google_maps_flutter: ^2.15.0
  geolocator: ^13.0.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # --- QR CODE ---
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0

  # --- LOCAL STORAGE ---
  shared_preferences: ^2.2.0

  # --- UTILITIES ---
  url_launcher: ^6.3.0
  vibration: ^2.0.0
  audioplayers: ^6.0.0

  # --- ICONS ---
  cupertino_icons: ^1.0.8

  # ---- PERMISSIONS ----
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/icon.png
    - assets/icon/onboarding.png
    - assets/audio/alert.mp3